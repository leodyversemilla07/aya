name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: file:./ci.db
      LLM_API_KEY: test-key
      API_KEY: test-api-key
      BETTER_AUTH_SECRET: test-secret-for-ci-only-change-me
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:3001
      CORS_ORIGINS: http://localhost:3000
      SEED_FORCE: "true"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.16.1
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Audit production dependencies
        run: pnpm run audit

      - name: Check database migration drift
        run: pnpm run db:drift

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: End-to-end tests
        run: pnpm run test:e2e
        env:
          DATABASE_URL: file:./ci-e2e.db

      - name: Browser end-to-end tests
        run: pnpm --filter web run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
          if-no-files-found: ignore

  postgres-e2e:
    name: PostgreSQL migrations and API e2e
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://aya:aya@localhost:5432/aya
      POSTGRES_URL: postgresql://aya:aya@localhost:5432/aya
      LLM_API_KEY: test-key
      API_KEY: test-api-key
      BETTER_AUTH_SECRET: test-secret-for-ci-only-change-me
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:3001
      CORS_ORIGINS: http://localhost:3000
      SEED_FORCE: "true"
      NEXT_TELEMETRY_DISABLED: "1"

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aya
          POSTGRES_PASSWORD: aya
          POSTGRES_DB: aya
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aya"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.16.1
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check generated PostgreSQL schema
        run: pnpm run db:postgres:check

      - name: Apply and verify PostgreSQL migrations
        run: |
          pnpm --filter @workspace/db exec prisma migrate deploy
          pnpm --filter @workspace/db exec prisma migrate diff --from-url "$POSTGRES_URL" --to-schema-datamodel prisma/schema.postgresql.prisma --exit-code

      - name: Seed PostgreSQL test data
        run: pnpm run db:seed

      - name: Run API end-to-end tests against PostgreSQL
        run: pnpm --filter @aya/api run test:e2e
