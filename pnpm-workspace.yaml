packages:
  - "apps/*"
  - "packages/*"

# Use pnpm's cross-platform shell for package scripts.
shellEmulator: true

# Keep the project's dependency security and version pins centralized here.
overrides:
  "@babel/core": "7.29.7"
  "baseline-browser-mapping": "2.11.34"
  "brace-expansion@1": "1.1.21"
  "brace-expansion@2": "2.1.7"
  "brace-expansion@5": "5.0.12"
  "browserslist": "4.29.5"
  "deepmerge-ts": "8.0.2"
  "esbuild": "0.28.2"
  "express": "5.3.0"
  "fast-uri": "3.1.9"
  "form-data": "4.0.6"
  "handlebars": "4.7.10"
  "js-yaml@3": "3.15.2"
  "js-yaml@4": "4.3.2"
  "multer": "2.5.0"
  "nanoid": "3.3.20"
  "postcss": "8.5.32"
  "qs": "6.17.1"
  "source-map-js": "1.2.2"

# pnpm 12 requires dependency build scripts to be explicitly reviewed.
allowBuilds:
  "@biomejs/biome": true
  "@prisma/client": true
  "@prisma/engines": true
  "esbuild": true
  "prisma": true
  "unrs-resolver": true
